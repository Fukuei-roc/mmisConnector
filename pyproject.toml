[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmis-connector"
version = "0.1.0"
description = "HTTP-only MMIS query client"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mmis-connector = "mmis_connector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
